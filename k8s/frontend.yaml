apiVersion: apps/v1
kind: Deployment
metadata:
  name: wedding-frontend
  namespace: livekit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wedding-frontend
  template:
    metadata:
      labels:
        app: wedding-frontend
    spec:
      containers:
        - name: frontend
          image: wedding-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  # На этот сервис смотрит ингресс
  name: wedding-frontend
  namespace: livekit
spec:
  selector:
    app: wedding-frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
