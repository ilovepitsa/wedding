<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Поделитесь фото</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background-color: #fdf8f2;
      background-image:
        radial-gradient(ellipse at 20% 0%, rgba(212, 165, 130, 0.18) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 100%, rgba(196, 140, 140, 0.14) 0%, transparent 60%),
        radial-gradient(circle, rgba(200, 170, 145, 0.12) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 28px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      color: #4a3328;
    }

    .card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(210, 175, 150, 0.3);
      border-radius: 28px;
      padding: 52px 44px 44px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow:
        0 24px 64px rgba(139, 86, 60, 0.10),
        0 4px 16px rgba(139, 86, 60, 0.07),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }

    .flowers {
      font-size: 28px;
      letter-spacing: 6px;
      margin-bottom: 20px;
      opacity: 0.55;
      user-select: none;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.1rem;
      font-weight: 400;
      color: #3a2118;
      line-height: 1.25;
      margin-bottom: 12px;
    }

    h1 em {
      font-style: italic;
      color: #a0614a;
    }

    .subtitle {
      font-size: 0.92rem;
      color: #9c7565;
      line-height: 1.65;
      margin-bottom: 36px;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 auto 36px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(196, 149, 106, 0.5));
    }

    .divider::after {
      background: linear-gradient(to left, transparent, rgba(196, 149, 106, 0.5));
    }

    .divider-diamond {
      width: 6px;
      height: 6px;
      background: #c4956a;
      transform: rotate(45deg);
      flex-shrink: 0;
    }

    .upload-area {
      position: relative;
    }

    .upload-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(140deg, #c8896a 0%, #a86248 60%, #904d38 100%);
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 17px 38px;
      font-size: 1rem;
      font-family: 'Lato', sans-serif;
      font-weight: 400;
      letter-spacing: 0.6px;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease, opacity 0.2s;
      box-shadow: 0 8px 28px rgba(168, 98, 72, 0.38), 0 2px 8px rgba(168, 98, 72, 0.2);
      -webkit-tap-highlight-color: transparent;
    }

    .upload-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 14px 36px rgba(168, 98, 72, 0.45), 0 4px 12px rgba(168, 98, 72, 0.22);
    }

    .upload-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .upload-btn:disabled {
      cursor: default;
      opacity: 0.72;
    }

    .camera-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    #fileInput {
      display: none;
    }

    .status {
      margin-top: 24px;
      min-height: 22px;
      font-size: 0.88rem;
      line-height: 1.5;
      transition: opacity 0.3s;
    }

    .status:empty {
      opacity: 0;
    }

    .status.loading {
      color: #9c7565;
    }

    .status.success {
      color: #5e8f5a;
      font-weight: 400;
    }

    .status.error {
      color: #b84a40;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(156, 117, 101, 0.25);
      border-top-color: #c4956a;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      vertical-align: -2px;
      margin-right: 6px;
    }

    .note {
      margin-top: 32px;
      font-size: 0.76rem;
      color: #c4a491;
      line-height: 1.55;
    }

    @media (max-width: 480px) {
      .card {
        padding: 44px 28px 36px;
        border-radius: 22px;
      }
      h1 {
        font-size: 1.85rem;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="flowers">✿ ✦ ✿</div>

    <h1>Поделитесь<br><em>воспоминаниями</em></h1>
    <p class="subtitle">Загрузите ваше фото с&nbsp;нашего праздника — оно попадёт в&nbsp;общую галерею</p>

    <div class="divider"><div class="divider-diamond"></div></div>

    <div class="upload-area">
      <button class="upload-btn" id="uploadBtn">
        <svg class="camera-icon" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        Поделиться фото
      </button>

      <input type="file" id="fileInput" accept="image/*">
    </div>

    <div class="status" id="status"></div>

    <p class="note">Фото сохраняются в&nbsp;нашей закрытой галерее&nbsp;💕</p>
  </div>

  <script>
    const btn = document.getElementById('uploadBtn');
    const input = document.getElementById('fileInput');
    const status = document.getElementById('status');

    btn.addEventListener('click', () => input.click());

    input.addEventListener('change', async () => {
      const file = input.files[0];
      if (!file) return;
      input.value = '';

      btn.disabled = true;
      status.className = 'status loading';
      status.innerHTML = '<span class="spinner"></span>Загружаем фото…';

      const form = new FormData();
      form.append('photo', file);

      try {
        const res = await fetch('/api/upload', { method: 'POST', body: form });
        if (res.ok) {
          status.className = 'status success';
          status.textContent = '✓ Фото сохранено, спасибо! 💕';
        } else {
          const data = await res.json().catch(() => ({}));
          status.className = 'status error';
          status.textContent = '✗ ' + (data.error || 'Ошибка загрузки, попробуйте ещё раз');
        }
      } catch {
        status.className = 'status error';
        status.textContent = '✗ Нет соединения с сервером';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
