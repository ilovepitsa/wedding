<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Поделитесь фото</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
  <!--UPLOAD_MODE-->
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background-color: #fdf8f2;
      background-image:
        radial-gradient(ellipse at 20% 0%, rgba(212, 165, 130, 0.18) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 100%, rgba(196, 140, 140, 0.14) 0%, transparent 60%),
        radial-gradient(circle, rgba(200, 170, 145, 0.12) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 28px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      color: #4a3328;
    }

    .card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(210, 175, 150, 0.3);
      border-radius: 28px;
      padding: 52px 44px 44px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow:
        0 24px 64px rgba(139, 86, 60, 0.10),
        0 4px 16px rgba(139, 86, 60, 0.07),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }

    .flowers {
      font-size: 28px;
      letter-spacing: 6px;
      margin-bottom: 20px;
      opacity: 0.55;
      user-select: none;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.1rem;
      font-weight: 400;
      color: #3a2118;
      line-height: 1.25;
      margin-bottom: 12px;
    }

    h1 em {
      font-style: italic;
      color: #a0614a;
    }

    .subtitle {
      font-size: 0.92rem;
      color: #9c7565;
      line-height: 1.65;
      margin-bottom: 36px;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 auto 36px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(196, 149, 106, 0.5));
    }

    .divider::after {
      background: linear-gradient(to left, transparent, rgba(196, 149, 106, 0.5));
    }

    .divider-diamond {
      width: 6px;
      height: 6px;
      background: #c4956a;
      transform: rotate(45deg);
      flex-shrink: 0;
    }

    .upload-area {
      position: relative;
    }

    .upload-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(140deg, #c8896a 0%, #a86248 60%, #904d38 100%);
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 17px 38px;
      font-size: 1rem;
      font-family: 'Lato', sans-serif;
      font-weight: 400;
      letter-spacing: 0.6px;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease, opacity 0.2s;
      box-shadow: 0 8px 28px rgba(168, 98, 72, 0.38), 0 2px 8px rgba(168, 98, 72, 0.2);
      -webkit-tap-highlight-color: transparent;
    }

    .upload-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 14px 36px rgba(168, 98, 72, 0.45), 0 4px 12px rgba(168, 98, 72, 0.22);
    }

    .upload-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .upload-btn:disabled {
      cursor: default;
      opacity: 0.72;
    }

    .camera-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    #fileInput {
      display: none;
    }

    .status {
      margin-top: 24px;
      min-height: 22px;
      font-size: 0.88rem;
      line-height: 1.5;
      transition: opacity 0.3s;
    }

    .status:empty {
      opacity: 0;
    }

    .status.loading {
      color: #9c7565;
    }

    .status.success {
      color: #5e8f5a;
      font-weight: 400;
    }

    .status.error {
      color: #b84a40;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(156, 117, 101, 0.25);
      border-top-color: #c4956a;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      vertical-align: -2px;
      margin-right: 6px;
    }

    .note {
      margin-top: 32px;
      font-size: 0.76rem;
      color: #c4a491;
      line-height: 1.55;
    }

    .file-list {
      margin-top: 24px;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .file-list:empty {
      margin-top: 0;
    }

    .file-row {
      font-size: 0.82rem;
    }

    .file-row .file-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 6px;
    }

    .file-row .file-name {
      color: #6b4a39;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    .file-row .file-state {
      flex-shrink: 0;
      font-size: 0.76rem;
      color: #9c7565;
    }

    .file-row .file-state.success {
      color: #5e8f5a;
    }

    .file-row .file-state.error {
      color: #b84a40;
    }

    .file-row .bar {
      height: 6px;
      border-radius: 6px;
      background: rgba(196, 149, 106, 0.18);
      overflow: hidden;
    }

    .file-row .bar > span {
      display: block;
      height: 100%;
      width: 0%;
      border-radius: 6px;
      background: linear-gradient(90deg, #c8896a, #a86248);
      transition: width 0.2s ease;
    }

    .file-row.is-error .bar > span {
      background: #d99;
    }

    @media (max-width: 480px) {
      .card {
        padding: 44px 28px 36px;
        border-radius: 22px;
      }
      h1 {
        font-size: 1.85rem;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="flowers">✿ ✦ ✿</div>

    <h1>Поделитесь<br><em>воспоминаниями</em></h1>
    <p class="subtitle">Загрузите ваши фото и&nbsp;видео с&nbsp;нашего праздника — они попадут в&nbsp;общую галерею</p>

    <div class="divider"><div class="divider-diamond"></div></div>

    <div class="upload-area">
      <button class="upload-btn" id="uploadBtn">
        <svg class="camera-icon" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        Поделиться фото
      </button>

      <input type="file" id="fileInput" accept="image/*,video/*" multiple>
    </div>

    <div class="status" id="status"></div>

    <div class="file-list" id="fileList"></div>

    <p class="note">Фото и&nbsp;видео сохраняются в&nbsp;нашей закрытой галерее&nbsp;💕</p>
  </div>

  <script>
    const btn = document.getElementById('uploadBtn');
    const input = document.getElementById('fileInput');
    const status = document.getElementById('status');
    const fileList = document.getElementById('fileList');

    const CONCURRENCY = 3;
    const CHUNK_THRESHOLD = 10 * 1024 * 1024;
    const CHUNK_SIZE = 4 * 1024 * 1024;
    const MAX_CHUNK_RETRIES = 5;
    const CHUNK_BACKOFF = [1000, 2000, 4000, 8000, 16000];
    const MAX_TOTAL_WORKERS = 6; // shared slot pool across all chunked uploads
    const MAX_SIMPLE_RETRIES = 3;
    const SIMPLE_BACKOFF = [1000, 3000];

    // Semaphore leasing up to MAX_TOTAL_WORKERS slots across every active
    // chunked upload. Files compete for the same pool, so as some finish the
    // remaining ones naturally absorb the freed slots (e.g. 3 files → 2 each,
    // 1 file left → all 6).
    let _slots = MAX_TOTAL_WORKERS;
    const _slotWaiters = [];
    function acquireSlot() {
      if (_slots > 0) { _slots--; return Promise.resolve(); }
      return new Promise((r) => _slotWaiters.push(r));
    }
    function releaseSlot() {
      if (_slotWaiters.length) _slotWaiters.shift()();
      else _slots++;
    }

    // upload mode is authoritative from the backend; baked window.UPLOAD_MODE
    // (injected at image build time) is only a fallback.
    let MODE = window.UPLOAD_MODE || 'simple';
    const activeJobs = new Set(); // in-flight chunked progress objects

    let wakeLock = null;
    let wakeLockWanted = false;

    async function requestWakeLock() {
      if (!('wakeLock' in navigator)) return;
      try {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => {
          if (wakeLockWanted) requestWakeLock();
        });
      } catch {}
    }

    function releaseWakeLock() {
      wakeLockWanted = false;
      if (wakeLock) {
        wakeLock.removeEventListener('release', null);
        wakeLock.release().catch(() => {});
        wakeLock = null;
      }
    }

    function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }
    function uuid() {
      if (crypto.randomUUID) return crypto.randomUUID();
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
        const r = Math.random() * 16 | 0;
        const v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    }
    function fileKey(file) { return file.name + ':' + file.size + ':' + file.lastModified; }
    function extractError(body) {
      try { return JSON.parse(body).error || 'ошибка'; } catch { return 'ошибка'; }
    }

    function xhrSend(method, url, body, onProgress) {
      return new Promise((resolve) => {
        const xhr = new XMLHttpRequest();
        xhr.open(method, url);
        if (onProgress) xhr.upload.onprogress = onProgress;
        xhr.onload = () => resolve({
          status: xhr.status,
          body: xhr.responseText,
          ok: xhr.status >= 200 && xhr.status < 300,
        });
        xhr.onerror = () => resolve({ status: 0, ok: false, networkError: true });
        xhr.send(body);
      });
    }

    // fn(attempt) -> { ok, retryable, msg? }. Retries while retryable.
    async function retry(fn, attempts, backoff) {
      let last = { ok: false, retryable: false };
      for (let a = 0; a <= attempts; a++) {
        last = await fn(a);
        if (last.ok || !last.retryable) return last;
        if (a < attempts) await sleep(backoff[Math.min(a, backoff.length - 1)]);
      }
      return last;
    }

    // --- IndexedDB: persists chunked-upload progress across reloads ---
    function idbOpen() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('wedding_uploads', 1);
        req.onupgradeneeded = () => req.result.createObjectStore('chunks', { keyPath: 'key' });
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    let idbPromise = null;
    function idb() { if (!idbPromise) idbPromise = idbOpen().catch(() => null); return idbPromise; }
    async function idbGet(key) {
      const db = await idb(); if (!db) return null;
      return new Promise((resolve) => {
        const tx = db.transaction('chunks', 'readonly');
        const r = tx.objectStore('chunks').get(key);
        r.onsuccess = () => resolve(r.result || null);
        r.onerror = () => resolve(null);
      });
    }
    async function idbPut(val) {
      const db = await idb(); if (!db) return;
      return new Promise((resolve) => {
        const tx = db.transaction('chunks', 'readwrite');
        tx.objectStore('chunks').put(val);
        tx.oncomplete = () => resolve();
        tx.onerror = () => resolve();
      });
    }
    async function idbClear(key) {
      const db = await idb(); if (!db) return;
      return new Promise((resolve) => {
        const tx = db.transaction('chunks', 'readwrite');
        tx.objectStore('chunks').delete(key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => resolve();
      });
    }

    async function loadMode() {
      try {
        const r = await fetch('/api/config');
        if (r.ok) { const j = await r.json(); if (j.uploadMode) MODE = j.uploadMode; }
      } catch {}
    }

    btn.addEventListener('click', () => input.click());

    input.addEventListener('change', () => {
      const files = Array.from(input.files);
      input.value = '';
      if (!files.length) return;
      uploadAll(files);
    });

    function addRow(file) {
      const row = document.createElement('div');
      row.className = 'file-row';
      row.innerHTML =
        '<div class="file-head">' +
          '<span class="file-name"></span>' +
          '<span class="file-state">в очереди…</span>' +
        '</div>' +
        '<div class="bar"><span></span></div>';
      row.querySelector('.file-name').textContent = file.name;
      fileList.appendChild(row);
      return {
        bar: row.querySelector('.bar > span'),
        state: row.querySelector('.file-state'),
        row,
      };
    }

    async function uploadOne(file, ui) {
      ui.state.textContent = 'загрузка…';
      const uploadId = uuid();
      const res = await retry(() =>
        xhrSend('POST', '/api/upload?name=' + encodeURIComponent(file.name) +
          '&uploadId=' + uploadId, file, (e) => {
          if (e.lengthComputable) ui.bar.style.width = Math.round((e.loaded / e.total) * 100) + '%';
        }).then((r) => ({
          ok: r.ok,
          retryable: r.networkError || r.status >= 500,
          msg: r.ok ? null : extractError(r.body),
        })), MAX_SIMPLE_RETRIES, SIMPLE_BACKOFF);

      if (res.ok) {
        ui.bar.style.width = '100%';
        ui.state.textContent = '✓ готово';
        ui.state.className = 'file-state success';
        return true;
      }
      ui.row.classList.add('is-error');
      ui.state.textContent = '✗ ' + (res.msg || (res.networkError ? 'нет соединения' : 'ошибка'));
      ui.state.className = 'file-state error';
      return false;
    }

    async function syncStatus(prog) {
      const r = await xhrSend('GET', '/api/upload/status?uploadId=' + prog.uploadId);
      if (!r.ok) {
        // server lost the upload → start over with a fresh id
        prog.uploadId = uuid();
        prog.received = new Array(prog.total).fill(false);
        await idbPut(prog);
        return;
      }
      try {
        const j = JSON.parse(r.body);
        if (j.total !== prog.total) {
          prog.uploadId = uuid();
          prog.received = new Array(prog.total).fill(false);
          await idbPut(prog);
          return;
        }
        const set = new Set(j.received || []);
        for (let i = 0; i < prog.total; i++) prog.received[i] = set.has(i);
        await idbPut(prog);
      } catch {}
    }

    async function uploadOneChunked(file, ui) {
      const total = Math.ceil(file.size / CHUNK_SIZE);
      let prog = await idbGet(fileKey(file));
      if (!prog || prog.size !== file.size || prog.lastModified !== file.lastModified) {
        prog = {
          key: fileKey(file), uploadId: uuid(), name: file.name,
          size: file.size, lastModified: file.lastModified,
          total, received: new Array(total).fill(false),
        };
        await idbPut(prog);
      }
      activeJobs.add(prog);
      try {
        await syncStatus(prog);
        ui.state.textContent = 'загрузка…';
        let doneCount = prog.received.filter(Boolean).length;

        const queue = [];
        for (let i = 0; i < total; i++) if (!prog.received[i]) queue.push(i);

        let failed = false;
        const tasks = [];
        while (queue.length && !failed) {
          await acquireSlot();
          if (failed) { releaseSlot(); break; }
          const idx = queue.shift();
          if (prog.received[idx]) { releaseSlot(); continue; }
          const offset = idx * CHUNK_SIZE;
          const end = Math.min(offset + CHUNK_SIZE, file.size);
          const blob = file.slice(offset, end);
          tasks.push((async () => {
            try {
              const res = await retry(() =>
                xhrSend('POST', '/api/upload/chunk?uploadId=' + prog.uploadId +
                  '&index=' + idx + '&offset=' + offset + '&total=' + total +
                  '&size=' + file.size + '&name=' + encodeURIComponent(file.name), blob).then((r) => ({
                    ok: r.ok,
                    retryable: r.networkError || r.status >= 500,
                    msg: r.ok ? null : extractError(r.body),
                  })), MAX_CHUNK_RETRIES, CHUNK_BACKOFF);
              if (!res.ok) {
                failed = true;
                ui.row.classList.add('is-error');
                ui.state.textContent = '✗ ' + (res.msg || 'ошибка');
                ui.state.className = 'file-state error';
                return false;
              }
              prog.received[idx] = true;
              doneCount++;
              ui.bar.style.width = Math.round((doneCount / total) * 100) + '%';
              ui.state.textContent = 'загрузка… ' + doneCount + '/' + total;
              await idbPut(prog);
              return true;
            } finally {
              releaseSlot();
            }
          })());
        }
        const results = await Promise.all(tasks);
        if (failed || !results.every(Boolean)) return false;

        ui.state.textContent = 'финализация… загрузка на диск';
        ui.state.className = 'file-state active';
        const cres = await retry(() =>
          xhrSend('POST', '/api/upload/complete?uploadId=' + prog.uploadId +
            '&name=' + encodeURIComponent(file.name), null).then((r) => ({
            ok: r.ok,
            retryable: r.networkError || r.status >= 500,
            msg: r.ok ? null : extractError(r.body),
          })), MAX_CHUNK_RETRIES, CHUNK_BACKOFF);
        if (!cres.ok) {
          ui.row.classList.add('is-error');
          ui.state.textContent = '✗ ' + (cres.msg || 'ошибка');
          ui.state.className = 'file-state error';
          return false;
        }
        ui.bar.style.width = '100%';
        ui.state.textContent = '✓ готово';
        ui.state.className = 'file-state success';
        await idbClear(fileKey(file));
        return true;
      } finally {
        activeJobs.delete(prog);
      }
    }

    async function uploadAll(files) {
      await loadMode();
      btn.disabled = true;
      wakeLockWanted = true;
      requestWakeLock();
      status.className = 'status loading';
      status.innerHTML = '<span class="spinner"></span>Загружаем файлы…';
      fileList.innerHTML = '';

      const jobs = files.map((file) => ({ file, ui: addRow(file) }));
      let done = 0, ok = 0;

      const queue = jobs.slice();
      async function worker() {
        while (queue.length) {
          const job = queue.shift();
          const useChunked = MODE === 'chunked' && job.file.size > CHUNK_THRESHOLD;
          const success = useChunked
            ? await uploadOneChunked(job.file, job.ui)
            : await uploadOne(job.file, job.ui);
          done++;
          if (success) ok++;
          status.innerHTML = '<span class="spinner"></span>Загружено ' + done + ' из ' + jobs.length + '…';
        }
      }

      await Promise.all(
        Array.from({ length: Math.min(CONCURRENCY, jobs.length) }, worker)
      );

      const failed = jobs.length - ok;
      if (failed === 0) {
        status.className = 'status success';
        status.textContent = '✓ Загружено ' + ok + ' из ' + jobs.length + ', спасибо! 💕';
      } else {
        status.className = 'status error';
        status.textContent = 'Загружено ' + ok + ' из ' + jobs.length + ', не удалось: ' + failed;
      }
      btn.disabled = false;
      releaseWakeLock();
    }

    // Resume: on return to the tab or reconnect, re-sync in-flight chunked uploads.
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && wakeLockWanted && !wakeLock) requestWakeLock();
      if (document.visibilityState === 'visible') activeJobs.forEach((p) => syncStatus(p));
    });
    window.addEventListener('online', () => activeJobs.forEach((p) => syncStatus(p)));

    loadMode();
  </script>
</body>
</html>
